; SwingGoldEA - Headless Einzeltest fuer Eigengeld 100k EUR, Cap-Variante
; Prueft ob InpMaxLotsPerTicket=200 (statt 50) die 100k-Performance veraendert.
; Ziel: Cap soll bei Eigengeld-Konten nur noch als Sicherheitsnetz gegen
; SYMBOL_VOLUME_MAX wirken, nicht mehr als aktiver Deckel (siehe
; InpMaxRiskPctPerTrade=25, das bereits kapitalunabhaengig deckelt).
; Vergleich: 100k mit Cap=50 (Referenz): Profit 167.21% = 2.090%/Mo, DD 16.01%,
; Margin Level 105.10%, PF 1.24, Sharpe 1.24, Recovery 3.35.
; Erwartung: identische oder sehr aehnliche Werte, wenn Cap=50 bereits kaum griff.
;
; Aufruf:
;   terminal64.exe /config:SwingGoldEA_Backtest_Eigengeld_100k_Cap200.ini
;

