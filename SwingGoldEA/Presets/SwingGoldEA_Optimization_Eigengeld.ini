Symbol=XAUUSD
Period=M15
Optimization=2
Model=1
FromDate=2020.01.01
ToDate=2026.09.05
ForwardMode=0
Deposit=3000
Currency=EUR
Leverage=30
ExecutionMode=0
OptimizationCriterion=0
Visual=0
