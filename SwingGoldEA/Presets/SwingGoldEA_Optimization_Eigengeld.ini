; SwingGoldEA - Headless Strategy-Tester-Config fuer Eigengeld-Optimierung
; Fokus: InpPartialPct isoliert optimieren (0-100%, Step 10).(alle anderen Parameter fixiert
; auf validiertem Best-Kandidat: DipBuy=23/Overlap=1.5/London=3.0).
; Frage: Ist 1:2 R:R fuer den London-Breakout optimal, oder bringt 1:2.5-1:3
; mehr Profit durch hoehere TP-Aufloesung?
;
; Deposit 10.000 EUR, Leverage 1:30.
; 11 Passes (1.50-4.00, Step 0.25) - sehr schnell.
;
; Aufruf:
;   terminal64.exe /config:SwingGoldEA_Optimization_Eigengeld.ini
;

