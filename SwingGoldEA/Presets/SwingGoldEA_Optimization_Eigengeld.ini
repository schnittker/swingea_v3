; SwingGoldEA - Headless Strategy-Tester-Config fuer Eigengeld-Optimierung
; Ziel: Profit maximieren (kein hartes DD-Limit waehrend der Suche).
; Danach Ergebnisliste manuell nach Equity-DD% <= 30% filtern und besten
; Kandidaten per analyze_daily_dd.py auf Tages-DD pruefen.
;
; Erkenntnisse aus FTMO-Optimierung (DipBuy/Overlap/London, Asia=aus):
;   Asia hat negativen Edge -> deaktiviert
;   London hat positiven Edge (PF bis 1.22) -> aktiv
;   DrawdownGuard-Scaling (1.5%/3.0%) begrenzt DD auch bei hohem Risiko nichtlinear
;
; Deposit 3.000 EUR (Eigengeld-Konto, IG Markets), Leverage 1:30.
; InpMaxDailyLossPct/InpMaxTotalDDPct=100 (deaktiviert) - wuerden Suche
; verzerren. InpMaxRiskPctPerTrade/InpMaxClusterRiskPct hochgesetzt damit
; sie nicht als versteckter Deckel eingreifen (bekannte Falle, ea.md 8.4a).
;
; Aufruf:
;   terminal64.exe /config:SwingGoldEA_Optimization_Eigengeld.ini
;

[Common]
Login=
Password=

[Tester]
